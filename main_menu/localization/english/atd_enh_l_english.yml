l_english:
 # [ATD-ENH] Autonomous Diplomats Enhanced - enhancement layer by azimali322.
 # Deleting this file with the other atd_enh_* files removes every string.

 # Auto Interactions (interactions) Tab - Cultural View Reminders group
 atd__interactions__enh_culture_view_name: "Cultural View Reminders"
 atd__enh_culture_view_notify_enabled_name: "Notify When a Cultural View Can Be Improved"
 atd__enh_culture_view_notify_enabled_desc: "Show an alert whenever you can use Improve Cultural View on a country: it leads its own culture, isn't your subject, its culture doesn't already see yours as kindred, and you have the 50 favors with it that the action costs. Up to three are named; left-click the alert to open the full list. Only while you lead your own culture and Enabled is on in the Settings tab. Auto-Gifting is one way to build the favors."

 # Cultural View alerts - one variant per count, so the tooltip can name them.
 atd_enh_alert_culture_view_1: "atd_enh_alert_culture_view_1"
 atd_enh_alert_culture_view_1_color: "green"
 atd_enh_alert_culture_view_1_icon: "@culture!"
 atd_enh_alert_culture_view_1_name: "Cultural View Ready"
 atd_enh_alert_culture_view_1_tooltip: "You have enough favors to improve how [Player.MakeScope.GetVariable('atd_enh_cv_t1').Country.GetName]'s culture views yours. Left-click to open the list; right-click to dismiss."
 atd_enh_alert_culture_view_2: "atd_enh_alert_culture_view_2"
 atd_enh_alert_culture_view_2_color: "green"
 atd_enh_alert_culture_view_2_icon: "@culture!"
 atd_enh_alert_culture_view_2_name: "Cultural Views Ready"
 atd_enh_alert_culture_view_2_tooltip: "You have enough favors to improve how the cultures of [Player.MakeScope.GetVariable('atd_enh_cv_t1').Country.GetName] and [Player.MakeScope.GetVariable('atd_enh_cv_t2').Country.GetName] view yours. Left-click to open the list; right-click to dismiss."
 atd_enh_alert_culture_view_3: "atd_enh_alert_culture_view_3"
 atd_enh_alert_culture_view_3_color: "green"
 atd_enh_alert_culture_view_3_icon: "@culture!"
 atd_enh_alert_culture_view_3_name: "Cultural Views Ready"
 atd_enh_alert_culture_view_3_tooltip: "You have enough favors to improve how the cultures of [Player.MakeScope.GetVariable('atd_enh_cv_t1').Country.GetName], [Player.MakeScope.GetVariable('atd_enh_cv_t2').Country.GetName] and [Player.MakeScope.GetVariable('atd_enh_cv_t3').Country.GetName] view yours. Left-click to open the list; right-click to dismiss."
 atd_enh_alert_culture_view_more: "atd_enh_alert_culture_view_more"
 atd_enh_alert_culture_view_more_color: "green"
 atd_enh_alert_culture_view_more_icon: "@culture!"
 atd_enh_alert_culture_view_more_name: "Cultural Views Ready"
 atd_enh_alert_culture_view_more_tooltip: "You have enough favors to improve how the cultures of [Player.MakeScope.GetVariable('atd_enh_cv_t1').Country.GetName], [Player.MakeScope.GetVariable('atd_enh_cv_t2').Country.GetName], [Player.MakeScope.GetVariable('atd_enh_cv_t3').Country.GetName] and more view yours. Left-click to open the list; right-click to dismiss."

 # Cultural Views window and its action-bar button
 atd_enh_open_culture_view_name: "Cultural Views"
 atd_enh_open_culture_view_tooltip: "Open the list of countries whose culture's view of yours you can improve right now."
 atd_enh_open_culture_view_icon: "@culture!"
 atd_enh_open_culture_view_color: "green"
 atd_enh_culture_view_window_title: "Cultural Views You Can Improve"
 atd_enh_culture_view_window_help: "You have at least 50 favors with each of these countries - enough for Improve Cultural View. Click a country to open its diplomacy screen, then use Improve Cultural View under Friendly Actions. Each use spends 50 favors and moves that culture's view of yours one step closer to kindred."
 atd_enh_culture_view_window_empty: "No country qualifies right now. You need at least 50 favors with a country that leads its own culture, isn't your subject, and whose culture doesn't already see yours as kindred - and you must lead your own culture. Auto-Gifting is one way to build favors."
 atd_enh_culture_view_window_row_tt: "Open this country's diplomacy screen to improve its culture's view of yours."

 # Subjects (subjects) Tab - Subject Actions row 3 and the Options group
 atd__enforce_i3_name: "Improve Cultural View"
 atd__enforce_i3_desc: "Automatically ask a subject that leads its own culture to improve that culture's view of yours (the Improve Cultural View subject action). The game allows it once every 50 years for your whole country, and only while you lead your own culture. The subject needs at least 50 loyalty and under 50 liberty desire, and its culture must not already see yours as kindred. Uses one diplomat and adds a little liberty desire."
 atd__subjects__enh_options_name: "Options"
 atd__enh_enforce_culture_skip_leaders_name: "Enforce Culture: Skip Subject Culture Leaders"
 atd__enh_enforce_culture_skip_leaders_desc: "When on, Enforce Culture leaves alone any subject that is the dominant country of its culture, so you can use Improve Cultural View on it instead of converting its culture."

 # Mod Action Log entry ([action] [subject name])
 atd_enh_log_subject_cv: "Improved the cultural view of"

 # Self-referencing flag keys (silence the engine's unused-flag warnings)
 atd__interactions__enh_culture_view: "atd__interactions__enh_culture_view"
 atd__enh_culture_view_notify_enabled: "atd__enh_culture_view_notify_enabled"
 atd__subjects__enh_options: "atd__subjects__enh_options"
 atd__enh_enforce_culture_skip_leaders: "atd__enh_enforce_culture_skip_leaders"
 atd_enh_cv_t1: "atd_enh_cv_t1"
 atd_enh_cv_t2: "atd_enh_cv_t2"
 atd_enh_cv_t3: "atd_enh_cv_t3"
 atd_enh_cv_n: "atd_enh_cv_n"

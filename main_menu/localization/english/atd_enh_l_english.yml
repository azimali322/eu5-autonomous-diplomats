l_english:
 # [ATD-ENH] Localization for the favor-economy / subject cultural-view
 # enhancements (external contribution, azimali322). Deleting this file with the
 # other atd_enh_* files removes all enhancement strings.

 # Favors (favors) Tab
 atd__favors_name: "Favors"
 ## Automation (automation) Group
 atd__favors__automation_name: "Automation"
 atd__enh_favors_enabled_name: "Improve Favors"
 atd__enh_favors_enabled_desc: "Master switch for the favor automation below. Each month, favors are built with the target categories in priority order (using Curry Favors and/or Send Gifts), and Culture Improve can spend them. Respects your diplomat reserve, and only runs while Enabled is on in the Settings tab."
 atd__enh_curry_enabled_name: "Curry Favors"
 atd__enh_curry_enabled_desc: "Build favors with the Curry Favors diplomatic action: an ongoing action that ties up a diplomat and adds about +0.75 favors owed to you each month (while you accrue +0.25 owed to them). The game requires at least 10 relations with the target and caps coexisting favors at 25, which is why the limit below cannot go higher. The automation starts it once per target and leaves it running; it will not re-issue it while it is already going."
 atd__enh_culture_improve_enabled_name: "Culture Improve Non-Subjects"
 atd__enh_culture_improve_enabled_desc: "Spend 50 favors to improve a non-subject dominant country of a primary culture's view toward your culture. Only targets nations that already owe you the full 50 favors, and only while you are the dominant country of your own culture. (Subjects are handled by the Improve Cultural View subject action on the Subjects tab.)"
 atd__enh_culture_improve_count_name: "Culture Improves Per Month"
 atd__enh_culture_improve_count_desc: "The most Culture Improve actions performed in a single month."
 atd__enh_culture_improve_count_format: "[CMMV('atd__enh_culture_improve_count')|0]"
 ## Limits (limits) Group
 atd__favors__limits_name: "Limits"
 atd__enh_curry_favor_cap_name: "Curry Favors Up To"
 atd__enh_curry_favor_cap_desc: "Curry Favors stops targeting a nation once it owes you this many favors. The game itself caps curried favors at 25 (CURRY_FAVORS_MAX_FAVORS), so this cannot go higher - gifts take it the rest of the way toward the Send Gifts cap."
 atd__enh_curry_favor_cap_format: "[CMMV('atd__enh_curry_favor_cap')|0]"
 atd__enh_gift_favor_cap_name: "Send Gifts Up To"
 atd__enh_gift_favor_cap_desc: "Send Gifts stops targeting a nation once it owes you this many favors. Culture Improve spends 50 favors, so 50 covers one use."
 atd__enh_gift_favor_cap_format: "[CMMV('atd__enh_gift_favor_cap')|0]"
 ## Target-category list
 atd__favors__enh_favor_targets_name: "Favor Targets"
 atd__favors__enh_favor_targets_desc: "Categories of countries to build favors with, in priority order."
 atd__enh_favor_targets_name: "Favor Targets"
 atd__enh_favor_targets_desc: "Categories of countries to build favors with, in priority order (drag to reorder; higher = first). Each category's slider sets how many favor-building actions it may use per month; 0 disables it."
 atd__enh_favor_targets_item_column_name: "Category"
 atd__enh_favor_targets_i1_name: "Dominant Culture Countries"
 atd__enh_favor_targets_i1_desc: "Build favors with each dominant country of a primary culture - the only targets Culture Improve can spend favors on."
 atd__enh_favor_targets_i2_name: "Neighboring Countries"
 atd__enh_favor_targets_i2_desc: "Build favors with countries that border you."
 atd__enh_favor_targets_i3_name: "Own Subject Countries"
 atd__enh_favor_targets_i3_desc: "Build favors with your subject countries."
 atd__enh_favor_targets_i4_name: "Outraged Countries"
 atd__enh_favor_targets_i4_desc: "Build favors with countries that are antagonistic toward you, most antagonistic first."
 atd__enh_favor_targets_i5_name: "Allies"
 atd__enh_favor_targets_i5_desc: "Build favors with your allies and defensive league members."
 atd__enh_favor_targets_i6_name: "Threatening Countries"
 atd__enh_favor_targets_i6_desc: "Build favors with countries that threaten you, greatest threats first."
 atd__enh_favor_targets_i7_name: "Market Owners"
 atd__enh_favor_targets_i7_desc: "Build favors with countries that own a market."
 atd__enh_favor_targets_i8_name: "Kingdoms and Empires"
 atd__enh_favor_targets_i8_desc: "Build favors with kingdoms and empires."
 atd__enh_favor_targets_i9_name: "Largest Nations"
 atd__enh_favor_targets_i9_desc: "Build favors with the largest nations in diplomatic range, biggest first."
 atd__enh_favor_targets__count_name: "Actions"
 ## Gifts (gifts) Group
 atd__favors__gifts_name: "Gifts"
 atd__enh_gift_notify_enabled_name: "Notify When Giftable"
 atd__enh_gift_notify_enabled_desc: "Show an alert naming the dominant countries of a primary culture you can send a gift to right now - ones off their 10-year gift cooldown that still owe you less than the Send Gifts Up To limit. Up to three are named by name, then 'and others'. Works even when the automation is off."

 # Settings (settings) Tab - Estate group
 atd__settings__estate_name: "Estate"
 atd__enh_ask_nobility_enabled_name: "Auto Ask Nobility for Diplomats"
 atd__enh_ask_nobility_enabled_desc: "Automatically use the Ask Nobility for Diplomats estate action whenever it comes off its 5-year cooldown: +5 diplomats for -0.15 Nobles estate satisfaction. Diplomats gate every automation in this mod, so this keeps the pool topped up - but it spends estate satisfaction every time, so it is off by default. Requires the Nobles estate."

 # Settings (settings) Tab - Automation Priority list
 atd__settings__enh_priority_name: "Automation Priority"
 atd__settings__enh_priority_desc: "The order in which the automations claim your diplomats each month."
 atd__enh_priority_name: "Automation Priority"
 atd__enh_priority_desc: "Drag to set which automation gets diplomats first each month (higher = first). All three respect the diplomat reserve; this decides who spends what remains above it."
 atd__enh_priority_item_column_name: "Automation"
 atd__enh_priority_i1_name: "Subjects"
 atd__enh_priority_i1_desc: "The Subject Actions automations (Enforce Religion, Enforce Culture, Improve Cultural View)."
 atd__enh_priority_i2_name: "Favors"
 atd__enh_priority_i2_desc: "The favor automations on the Favors tab (Curry Favors, Send Gifts, Culture Improve Non-Subjects)."
 atd__enh_priority_i3_name: "Improve Relations"
 atd__enh_priority_i3_desc: "The Improve Relations category automations."

 # Subject Actions list item 3 + tooltips for the base items (additive keys)
 atd__enforce_i1_desc: "Automatically enforce your state religion on loyal subjects (loyalty >= 50, liberty desire < 50) that can be converted. Uses a diplomat per action."
 atd__enforce_i2_desc: "Automatically enforce your primary culture on loyal subjects (loyalty >= 50, liberty desire < 50). Uses a diplomat per action."
 atd__enforce_i3_name: "Improve Cultural View"
 atd__enforce_i3_desc: "Ask culture-leader subjects (the dominant country of their culture) to improve their culture's view of yours, replicating the Improve Cultural View subject action. Has a 50-year cooldown per subject and only works while you lead your own culture. Uses a diplomat per action."

 # Subjects (subjects) Tab - Options group
 atd__subjects__options_name: "Options"
 atd__enh_enforce_culture_skip_leaders_name: "Enforce Culture: Skip Subject Culture Leaders"
 atd__enh_enforce_culture_skip_leaders_desc: "When on, Enforce Culture leaves subjects that are the dominant country of their culture alone, so you can use Improve Cultural View on them instead of converting their culture."

 # Gift-availability alerts - one variant per count so the tooltip can name them.
 atd_enh_alert_giftable_1: "atd_enh_alert_giftable_1"
 atd_enh_alert_giftable_1_color: "yellow"
 atd_enh_alert_giftable_1_icon: "@favors!"
 atd_enh_alert_giftable_1_name: "Gift Available"
 atd_enh_alert_giftable_1_tooltip: "You can send a gift to [Player.MakeScope.GetVariable('atd_enh_gift_t1').Country.GetName] to build favors toward improving your cultures' view of each other. Left-click to open the full list; right-click to dismiss."
 atd_enh_alert_giftable_2: "atd_enh_alert_giftable_2"
 atd_enh_alert_giftable_2_color: "yellow"
 atd_enh_alert_giftable_2_icon: "@favors!"
 atd_enh_alert_giftable_2_name: "Gifts Available"
 atd_enh_alert_giftable_2_tooltip: "You can send gifts to [Player.MakeScope.GetVariable('atd_enh_gift_t1').Country.GetName] and [Player.MakeScope.GetVariable('atd_enh_gift_t2').Country.GetName] to build favors toward improving your cultures' view of each other. Left-click to open the full list; right-click to dismiss."
 atd_enh_alert_giftable_3: "atd_enh_alert_giftable_3"
 atd_enh_alert_giftable_3_color: "yellow"
 atd_enh_alert_giftable_3_icon: "@favors!"
 atd_enh_alert_giftable_3_name: "Gifts Available"
 atd_enh_alert_giftable_3_tooltip: "You can send gifts to [Player.MakeScope.GetVariable('atd_enh_gift_t1').Country.GetName], [Player.MakeScope.GetVariable('atd_enh_gift_t2').Country.GetName] and [Player.MakeScope.GetVariable('atd_enh_gift_t3').Country.GetName] to build favors toward improving your cultures' view of each other. Left-click to open the full list; right-click to dismiss."
 atd_enh_alert_giftable_more: "atd_enh_alert_giftable_more"
 atd_enh_alert_giftable_more_color: "yellow"
 atd_enh_alert_giftable_more_icon: "@favors!"
 atd_enh_alert_giftable_more_name: "Gifts Available"
 atd_enh_alert_giftable_more_tooltip: "You can send gifts to [Player.MakeScope.GetVariable('atd_enh_gift_t1').Country.GetName], [Player.MakeScope.GetVariable('atd_enh_gift_t2').Country.GetName], [Player.MakeScope.GetVariable('atd_enh_gift_t3').Country.GetName] and others - every dominant country of a primary culture that is off its gift cooldown and still owes you less than the Send Gifts Up To limit. Left-click to open the full list; right-click to dismiss."

 # Giftable Countries window + its action-bar button
 atd_enh_open_gifts_name: "Giftable Countries"
 atd_enh_open_gifts_tooltip: "Open the list of countries you can send a gift to right now."
 atd_enh_open_gifts_icon: "@favors!"
 atd_enh_open_gifts_color: "gold"
 atd_enh_gifts_window_title: "Countries You Can Gift"
 atd_enh_gifts_window_help: "Gifts cannot be automated - the game only allows them through its own window, which is also where you set the amount. Click a country to jump to its diplomacy screen, then pick the Economy filter and Send Gift. Max the slider for the most favors (5 by default, up to 10)."
 atd_enh_gifts_window_empty: "No country is giftable right now. Everyone eligible is either on the 10-year gift cooldown or already owes you at least the Send Gifts Up To limit."
 atd_enh_gifts_window_row_tt: "Open this country's diplomacy screen. Choose the Economy filter there to find Send Gift."

 # Mod Action Log entries ([action] [target name])
 atd_enh_log_curry: "Curried favors with"
 atd_enh_log_culture: "Improved cultural view with"
 atd_enh_log_subject_cv: "Improved subject cultural view with"
 atd_enh_log_ask_nobility: "Asked the Nobility for diplomats"


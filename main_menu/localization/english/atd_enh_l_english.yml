 atd__enh_culture_improve_enabled: "atd__enh_culture_improve_enabled"
 atd__enh_culture_improve_count: "atd__enh_culture_improve_count"
 atd__enh_curry_favor_cap: "atd__enh_curry_favor_cap"
 atd__enh_gift_favor_cap: "atd__enh_gift_favor_cap"
